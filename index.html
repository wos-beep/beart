<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊狩行動編成シミュレーター</title>
    <style>
        :root {
            --bg: #0b0d0e; --card: #1c1f23; --input-bg: #2a2e33;
            --text-main: #e9ecef; --text-sub: #adb5bd;
            --accent: #ff9f43; /* 熊狩をイメージした暖色アクセント */
            --danger: #ff5252; --success: #00b894; --border: #444;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .main-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 380px; border: 1px solid #333; flex: 1 1 350px; }
        .char-name-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--accent); color: var(--accent); font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 15px; padding: 5px; outline: none; }
        .group-label { font-size: 0.7rem; font-weight: bold; color: var(--text-sub); text-transform: uppercase; margin: 12px 0 6px 4px; display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-size: 0.8rem; color: var(--text-sub); }
        input[type="text"], select { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; color: #fff; font-family: monospace; outline: none; }
        .results { margin-top: 15px; }
        .plan-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .plan-box { background: #161a1e; padding: 10px; border-radius: 8px; border: 1px solid #333; min-height: 85px; }
        .plan-title { font-size: 0.7rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .res-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #333; align-items: center; }
        .res-label { font-size: 0.75rem; color: var(--text-sub); }
        .res-val { font-weight: 600; font-family: monospace; font-size: 0.9rem; }
        .rem-val { color: var(--danger); font-weight: bold; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--accent); margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,159,67,0.3); }
        .global-actions { text-align: center; margin-top: 30px; }
        .clear-btn { background: none; border: 1px solid #444; color: #777; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>🐻 熊狩行動編成シミュレーター</h1></div>

<div class="main-container" id="cards-wrapper">
    </div>

<div class="global-actions">
    <button class="clear-btn" onclick="clearAllData()">全データをリセット</button>
</div>

<script>
    const monkeyOpts = [0, 7500, 9000, 10500, 12000, 13500, 15000];
    const cyrilOpts = [0, 3000, 6000, 9000, 12000, 15000, 18000, 21000, 24000, 27000, 30000];
    const managerOpts = [0, 2500, 3750];
    const buffOpts = [0, 10, 20];
    const slotOpts = [
        {val: 6, label: "5部隊 + スペシャル(計6)"},
        {val: 7, label: "6部隊 + スペシャル(計7)"}
    ];

    const wrapper = document.getElementById('cards-wrapper');
    for (let i = 0; i < 3; i++) {
        wrapper.innerHTML += `
        <div class="card" id="char-${i}">
            <input type="text" class="char-name-input" placeholder="キャラ名 ${i+1}" oninput="updateAll(${i})">
            
            <div class="group-label">基本設定</div>
            <div class="form-group">
                <label>出征部隊数 (スペシャル込)</label>
                <select class="slots" onchange="updateAll(${i})"></select>
            </div>
            <div class="form-group">
                <label>出征容量(基礎)</label>
                <input type="text" class="baseCap" placeholder="0" oninput="handleInput(${i}, this)">
            </div>

            <div class="group-label">兵士数</div>
            <div class="form-group"><label>赤弓兵 (上)</label><input type="text" class="redArch" placeholder="0" oninput="handleInput(${i}, this)"></div>
            <div class="form-group"><label>弓兵 (下)</label><input type="text" class="arch" placeholder="0" oninput="handleInput(${i}, this)"></div>

            <div class="group-label">補正（固定値）</div>
            <div class="form-group"><select class="monkey" onchange="updateAll(${i})"></select></div>
            <div class="form-group"><select class="cyril" onchange="updateAll(${i})"></select></div>
            <div class="form-group"><select class="manager" onchange="updateAll(${i})"></select></div>

            <div class="group-label">補正（倍率）</div>
            <div class="form-group"><select class="buff" onchange="updateAll(${i})"></select></div>

            <div class="results">
                <div class="res-row"><span class="res-label">最終容量</span><span class="res-val totalCap">0</span></div>
                <div class="res-row"><span class="res-label">弓兵合計</span><span class="res-val totalArch">0</span></div>
                <div class="plan-container">
                    <div class="plan-box">
                        <div class="plan-title">均等プラン</div>
                        <div class="avgPlanBody"></div>
                        <div class="res-row"><span class="res-val rem-val avgRem">0</span></div>
                    </div>
                    <div class="plan-box" style="border-color:var(--accent)">
                        <div class="plan-title">最適化配分</div>
                        <div class="optPlanBody"></div>
                        <div class="res-row"><span class="res-val rem-val optRem" style="color:var(--success)">0</span></div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    window.onload = function() {
        initSelectors();
        loadAllData();
    };

    function initSelectors() {
        for (let i = 0; i < 3; i++) {
            const root = document.querySelector(`#char-${i}`);
            slotOpts.forEach(o => root.querySelector('.slots').add(new Option(o.label, o.val)));
            monkeyOpts.forEach(v => root.querySelector('.monkey').add(new Option(v === 0 ? "雪猿: なし" : `雪猿: ${v.toLocaleString()}`, v)));
            cyrilOpts.forEach(v => root.querySelector('.cyril').add(new Option(v === 0 ? "シリル: なし" : `シリル: ${v.toLocaleString()}`, v)));
            managerOpts.forEach(v => root.querySelector('.manager').add(new Option(v === 0 ? "戦略部長: なし" : `戦略部長: ${v.toLocaleString()}`, v)));
            buffOpts.forEach(v => root.querySelector('.buff').add(new Option(v === 0 ? "容量バフ: なし" : `容量バフ: ${v}%`, v)));
            
            root.querySelector('.slots').value = 7;
            root.querySelector('.monkey').value = 9000;
            root.querySelector('.cyril').value = 27000;
        }
    }

    function handleInput(index, el) {
        let cursor = el.value.length - el.selectionEnd;
        let raw = el.value.replace(/,/g, '').replace(/\D/g, '');
        el.value = raw ? Number(raw).toLocaleString() : "";
        let newEnd = el.value.length - cursor;
        el.setSelectionRange(newEnd, newEnd);
        updateAll(index);
    }

    function getVal(index, className) {
        return document.querySelector(`#char-${index} .${className}`).value.replace(/,/g, '');
    }

    function updateAll(index) {
        const slots = parseInt(getVal(index, 'slots'));
        const baseCap = parseInt(getVal(index, 'baseCap')) || 0;
        const redArch = parseInt(getVal(index, 'redArch')) || 0;
        const arch = parseInt(getVal(index, 'arch')) || 0;
        const monkey = parseInt(getVal(index, 'monkey'));
        const cyril = parseInt(getVal(index, 'cyril'));
        const manager = parseInt(getVal(index, 'manager'));
        const buffPct = parseInt(getVal(index, 'buff'));

        const totalCap = Math.floor((baseCap + monkey + cyril + manager) * (1 + buffPct / 100));
        const totalArchers = redArch + arch;

        document.querySelector(`#char-${index} .totalCap`).textContent = totalCap.toLocaleString();
        document.querySelector(`#char-${index} .totalArch`).textContent = totalArchers.toLocaleString();

        if (totalCap > 0 && totalArchers > 0) {
            calculateAvg(index, totalArchers, totalCap, slots);
            calculateOpt(index, totalArchers, totalCap, slots);
        }
        saveAllData();
    }

    function calculateAvg(idx, tArch, tCap, slots) {
        const archGroup = Math.floor(tArch / slots);
        let ratio = Math.floor((archGroup / tCap) * 100) / 100;
        ratio = Math.min(ratio, 0.98);
        const rem = tArch - (tCap * ratio * slots);
        document.querySelector(`#char-${idx} .avgPlanBody`).innerHTML = `割合 <b>${ratio.toFixed(2)}</b><br>× ${slots}部隊`;
        document.querySelector(`#char(`#char-${idx} .avgRem`).textContent = Math.round(rem).toLocaleString();
    }

    function calculateOpt(idx, tArch, tCap, slots) {
        let best = { rem: Infinity, r1: 0, n1: 0, r2: 0, n2: 0 };
        for (let n1 = 0; n1 <= slots; n1++) {
            let n2 = slots - n1;
            for (let r1 = 0; r1 <= 0.981; r1 += 0.01) {
                let fr1 = Math.floor(r1 * 100) / 100;
                for (let r2 = 0; r2 <= 0.981; r2 += 0.01) {
                    let fr2 = Math.floor(r2 * 100) / 100;
                    let used = (tCap * fr1 * n1) + (tCap * fr2 * n2);
                    if (used <= tArch) {
                        let rem = tArch - used;
                        if (rem < best.rem) best = { rem: rem, r1: fr1, n1: n1, r2: fr2, n2: n2 };
                    }
                }
            }
        }
        document.querySelector(`#char-${idx} .optPlanBody`).innerHTML = `<b>${best.r1.toFixed(2)}</b> × ${best.n1}<br><b>${best.r2.toFixed(2)}</b> × ${best.n2}`;
        document.querySelector(`#char-${idx} .optRem`).textContent = Math.round(best.rem).toLocaleString();
    }

    function saveAllData() {
        const allData = [];
        for (let i = 0; i < 3; i++) {
            allData.push({
                name: document.querySelector(`#char-${i} .char-name-input`).value,
                slots: getVal(i, 'slots'),
                baseCap: getVal(i, 'baseCap'),
                redArch: getVal(i, 'redArch'),
                arch: getVal(i, 'arch'),
                monkey: getVal(i, 'monkey'),
                cyril: getVal(i, 'cyril'),
                manager: getVal(i, 'manager'),
                buff: getVal(i, 'buff')
            });
        }
        localStorage.setItem('bearHuntData', JSON.stringify(allData));
    }

    function loadAllData() {
        const saved = localStorage.getItem('bearHuntData');
        if (saved) {
            const data = JSON.parse(saved);
            data.forEach((d, i) => {
                if(!document.querySelector(`#char-${i}`)) return;
                document.querySelector(`#char-${i} .char-name-input`).value = d.name || "";
                document.querySelector(`#char-${i} .slots`).value = d.slots || 7;
                document.querySelector(`#char-${i} .baseCap`).value = d.baseCap ? Number(d.baseCap).toLocaleString() : "";
                document.querySelector(`#char-${i} .redArch`).value = d.redArch ? Number(d.redArch).toLocaleString() : "";
                document.querySelector(`#char-${i} .arch`).value = d.arch ? Number(d.arch).toLocaleString() : "";
                document.querySelector(`#char-${i} .monkey`).value = d.monkey;
                document.querySelector(`#char-${i} .cyril`).value = d.cyril;
                document.querySelector(`#char-${i} .manager`).value = d.manager || 0;
                document.querySelector(`#char-${i} .buff`).value = d.buff || 0;
                updateAll(i);
            });
        }
    }

    function clearAllData() {
        if(confirm("全データを消去しますか？")) {
            localStorage.removeItem('bearHuntData');
            location.reload();
        }
    }
</script>

</body>
</html>
